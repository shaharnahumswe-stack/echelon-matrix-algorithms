[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "echelon-matrix"
version = "1.0.0"
description = "Educational Gaussian-elimination algorithms for REF, rank, determinant, and inverse"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]
authors = [
  {name = "Shahar Nahum"},
  {name = "Arad Harush"}
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics"
]

[project.scripts]
echelon-matrix = "echelon_matrix.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
